    <script>
      // Apply the saved colour theme before first paint, so dark mode never flashes white.
      (function () {
        try {
          var mode = localStorage.getItem('sdg-playground:theme') || 'system';
          var dark = mode === 'dark' || (mode === 'system' && window.matchMedia('(prefers-color-scheme: dark)').matches);
          document.documentElement.dataset.pgTheme = dark ? 'dark' : 'light';
          document.documentElement.style.colorScheme = dark ? 'dark' : 'light';
        } catch (error) {
          /* storage blocked — the app falls back to the system preference */
        }
      })();
    </script>
