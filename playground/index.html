<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Live playground for react-smart-table-grid — every feature of the React data grid, running in your browser." />
    <meta name="color-scheme" content="light dark" />
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Cdefs%3E%3ClinearGradient id='g' x1='0' y1='0' x2='1' y2='1'%3E%3Cstop offset='0' stop-color='%234f46e5'/%3E%3Cstop offset='1' stop-color='%237c3aed'/%3E%3C/linearGradient%3E%3C/defs%3E%3Crect width='32' height='32' rx='8' fill='url(%23g)'/%3E%3Cpath d='M8 11h16M8 16h16M8 21h16M13 11v10' stroke='white' stroke-width='2' stroke-linecap='round'/%3E%3C/svg%3E"
    />
    <title>Smart Data Grid — Live Playground</title>
    <script>
      // Apply the saved colour theme before first paint, so dark mode never flashes white.
      (function () {
        try {
          var mode = localStorage.getItem('sdg-playground:theme') || 'system';
          var dark = mode === 'dark' || (mode === 'system' && window.matchMedia('(prefers-color-scheme: dark)').matches);
          document.documentElement.dataset.pgTheme = dark ? 'dark' : 'light';
          document.documentElement.style.colorScheme = dark ? 'dark' : 'light';
        } catch (error) {
          /* storage blocked — the app falls back to the system preference */
        }
      })();
    </script>
  </head>
  <body>
    <noscript>This playground needs JavaScript.</noscript>
    <div id="root"></div>
    <script type="module" src="/main.tsx"></script>
  </body>
</html>
